<body><main>
  <header><p class="eyebrow">カードアルバム · 管理機能の移行</p><h1>登録者DBへの接続確認</h1>

  <section class="panel"><h2>管理接続をテスト</h2>

  </section>
  <p id="message" role="status" aria-live="polite"></p>
